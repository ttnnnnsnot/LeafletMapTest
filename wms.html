<!DOCTYPE html>
<head>
    <title>WMS / WMTS — 政府 GIS 圖層</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #toolbar {
            padding: 10px 16px; background: #f5f5f5;
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0;
        }
        #toolbar a { text-decoration: none; color: #555; font-size: 0.9rem; }
        #map { flex: 1; }

        .layer-btn {
            padding: 5px 12px; border-radius: 4px; border: 1px solid #ccc;
            cursor: pointer; font-size: 0.82rem; background: #fff;
        }
        .layer-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    </style>
</head>
<body>
    <div id="toolbar">
        <a href="index.html">← 返回</a>
        <strong>WMS / WMTS — 國土測繪中心</strong>
        <button class="layer-btn active" data-layer="emap">電子地圖（WMTS）</button>
        <button class="layer-btn" data-layer="photo">正射影像（WMTS）</button>
        <button class="layer-btn" data-layer="wms-emap">電子地圖（WMS）</button>
    </div>
    <div id="map"></div>
    <script src="wms.js"></script>
</body>
</html>
