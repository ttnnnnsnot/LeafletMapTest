<!DOCTYPE html>
<head>
    <title>地圖事件 moveend / zoomend</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        #toolbar { padding: 10px 16px; background: #f5f5f5; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
        #toolbar a { text-decoration: none; color: #555; font-size: 0.9rem; }

        #main { display: flex; flex: 1; overflow: hidden; }
        #map { flex: 1; }

        /* 右側常駐面板 */
        #panel {
            width: 240px; flex-shrink: 0;
            background: #1e1e2e; color: #cdd6f4;
            font-family: monospace; font-size: 0.8rem;
            display: flex; flex-direction: column;
            border-left: 1px solid #313244;
        }
        #panel-state {
            padding: 12px;
            border-bottom: 1px solid #313244;
            line-height: 1.8;
        }
        #panel-state h3 { margin: 0 0 6px; font-size: 0.75rem; color: #89b4fa; letter-spacing: .05em; }
        #panel-state span { color: #a6e3a1; }

        #panel-log { padding: 12px; flex: 1; overflow-y: auto; }
        #panel-log h3 { margin: 0 0 6px; font-size: 0.75rem; color: #89b4fa; letter-spacing: .05em; }
        .log-item {
            padding: 4px 0;
            border-bottom: 1px solid #313244;
            line-height: 1.5;
            color: #cdd6f4;
        }
        .log-item .time { color: #6c7086; margin-right: 6px; }
        .log-item.highlight { color: #f38ba8; }
    </style>
</head>
<body>
    <div id="toolbar">
        <a href="index.html">← 返回</a>
        <strong>地圖事件 — moveend / zoomend / layeradd</strong>
    </div>
    <div id="main">
        <div id="map"></div>
        <div id="panel">
            <div id="panel-state">
                <h3>目前地圖狀態</h3>
                lat: <span id="s-lat">—</span><br>
                lng: <span id="s-lng">—</span><br>
                zoom: <span id="s-zoom">—</span>
            </div>
            <div id="panel-log">
                <h3>事件紀錄</h3>
                <div id="log-list"></div>
            </div>
        </div>
    </div>
    <script src="map-events.js"></script>
</body>
</html>
