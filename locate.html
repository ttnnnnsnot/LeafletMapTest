<!DOCTYPE html>
<head>
    <title>定位 map.locate()</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #toolbar { padding: 10px 16px; background: #f5f5f5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        #toolbar a { text-decoration: none; color: #555; font-size: 0.9rem; }
        button { padding: 5px 12px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; font-size: 0.85rem; }
        #status { font-size: 0.85rem; color: #555; }
        #map { height: calc(100vh - 44px); }
    </style>
</head>
<body>
    <div id="toolbar">
        <a href="index.html">← 返回</a>
        <strong>定位 — map.locate()</strong>
        <button id="btn-locate">取得我的位置</button>
        <span id="status">按下按鈕後瀏覽器會詢問定位權限</span>
    </div>
    <div id="map"></div>
    <script src="locate.js"></script>
</body>
</html>
