<!DOCTYPE html>
<head>
    <title>圖片疊加 L.imageOverlay()</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; }
        #toolbar { padding: 10px 16px; background: #f5f5f5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        #toolbar a { text-decoration: none; color: #555; font-size: 0.9rem; }
        input[type=range] { width: 100px; }
        label { font-size: 0.85rem; display: flex; align-items: center; gap: 6px; }
        #map { height: calc(100vh - 44px); }
    </style>
</head>
<body>
    <div id="toolbar">
        <a href="index.html">← 返回</a>
        <strong>圖片疊加 — L.imageOverlay()</strong>
        <label>透明度 <input type="range" id="opacity" min="0" max="1" step="0.05" value="0.7"></label>
    </div>
    <div id="map"></div>
    <script src="image-overlay.js"></script>
</body>
</html>
